[project]
name = "data-ml-toolkit"
version = "0.1.0"
description = "Shared SDK and tool versions for my data engineering and ML repositories."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "packaging>=24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# One place for the dev tool versions every repo uses. A repo adds
# `data-ml-toolkit[dev]` to its dev group instead of pinning these itself,
# so bumping the toolkit's tag moves all repos to the same versions.
dev = [
    "mypy==2.4.1",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "ruff==0.17.5",
]
# S3 helpers (data_ml_toolkit.s3)
aws = [
    "boto3>=1.35",
]

[project.scripts]
dmt = "data_ml_toolkit.cli:main"

[dependency-groups]
dev = [
    "boto3>=1.35",
    "boto3-stubs[s3]>=1.35",
    "data-ml-toolkit[dev]",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["^tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
